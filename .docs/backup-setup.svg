<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <title>SHIO local hierarchy with backup controllers (launch_hierarchy.sh)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- Level labels -->
  <g font-size="11" fill="#80868b" font-weight="bold" letter-spacing="1">
    <text x="30" y="30">GLOBAL</text>
    <text x="30" y="170">CLUSTER</text>
    <text x="30" y="310">LOCAL</text>
    <text x="30" y="420">JOBS</text>
  </g>

  <!-- Connections: cluster primaries -> global primary -->
  <g stroke="#5f6368" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="180" x2="330" y2="106"/>
    <line x1="630" y1="180" x2="430" y2="106"/>
    <!-- locals -> cluster primaries (down ports) -->
    <line x1="130" y1="320" x2="130" y2="246"/>
    <line x1="370" y1="320" x2="190" y2="246"/>
    <line x1="630" y1="320" x2="630" y2="246"/>
    <!-- jobs -> locals (UNIX sockets) -->
    <line x1="130" y1="430" x2="130" y2="372"/>
    <line x1="370" y1="430" x2="370" y2="372"/>
    <line x1="630" y1="430" x2="630" y2="372"/>
  </g>
  <g font-size="10" fill="#5f6368">
    <text x="210" y="138">:50051</text>
    <text x="540" y="138">:50051</text>
    <text x="138" y="290">:50053</text>
    <text x="330" y="292">:50053</text>
    <text x="638" y="290">:50055</text>
    <text x="138" y="405">/tmp/0.0.0.0:50057.socket</text>
    <text x="378" y="405">/tmp/0.0.0.0:50058.socket</text>
    <text x="638" y="405">/tmp/0.0.0.0:50059.socket</text>
  </g>

  <!-- Heartbeats: backup -> primary -->
  <g stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-hb)">
    <line x1="530" y1="72" x2="492" y2="72"/>
    <line x1="270" y1="212" x2="232" y2="212"/>
    <line x1="770" y1="212" x2="732" y2="212"/>
  </g>

  <!-- Global controller pair -->
  <rect x="270" y="40" width="220" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="380" y="66" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Global — primary</text>
  <text x="380" y="86" font-size="11" fill="#3c4043" text-anchor="middle">down :50051 · internal :50061</text>

  <rect x="530" y="40" width="220" height="64" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="66" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Global — backup</text>
  <text x="640" y="86" font-size="11" fill="#3c4043" text-anchor="middle">internal :50062</text>

  <!-- Cluster 1 pair -->
  <rect x="30" y="180" width="200" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="130" y="206" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Cluster 1 — primary</text>
  <text x="130" y="226" font-size="11" fill="#3c4043" text-anchor="middle">up :50052 · down :50053 · int :50071</text>

  <rect x="270" y="180" width="200" height="64" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="206" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Cluster 1 — backup</text>
  <text x="370" y="226" font-size="11" fill="#3c4043" text-anchor="middle">internal :50072</text>

  <!-- Cluster 2 pair -->
  <rect x="530" y="180" width="200" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="630" y="206" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Cluster 2 — primary</text>
  <text x="630" y="226" font-size="11" fill="#3c4043" text-anchor="middle">up :50054 · down :50055 · int :50073</text>

  <rect x="770" y="180" width="200" height="64" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="870" y="206" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">Cluster 2 — backup</text>
  <text x="870" y="226" font-size="11" fill="#3c4043" text-anchor="middle">internal :50074</text>

  <!-- Local controllers -->
  <g font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">
    <rect x="30" y="320" width="200" height="50" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
    <text x="130" y="341">Local 1</text>
    <rect x="270" y="320" width="200" height="50" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
    <text x="370" y="341">Local 2</text>
    <rect x="530" y="320" width="200" height="50" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
    <text x="630" y="341">Local 3</text>
  </g>
  <g font-size="11" fill="#3c4043" text-anchor="middle">
    <text x="130" y="359">:50057</text>
    <text x="370" y="359">:50058</text>
    <text x="630" y="359">:50059</text>
  </g>

  <!-- Jobs -->
  <g font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">
    <rect x="30" y="430" width="200" height="50" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="130" y="451">Job 1 (N1V1)</text>
    <rect x="270" y="430" width="200" height="50" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="370" y="451">Job 2 (N1V2)</text>
    <rect x="530" y="430" width="200" height="50" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
    <text x="630" y="451">Job 3 (N1V3)</text>
  </g>
  <g font-size="11" fill="#3c4043" text-anchor="middle">
    <text x="130" y="469">data plane stage(s)</text>
    <text x="370" y="469">data plane stage(s)</text>
    <text x="630" y="469">data plane stage(s)</text>
  </g>

  <!-- Failure markers on the primaries and jobs -->
  <g font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="486" cy="44" r="11" fill="#d93025"/><text x="486" y="48">1</text>
    <circle cx="226" cy="184" r="11" fill="#d93025"/><text x="226" y="188">2</text>
    <circle cx="726" cy="184" r="11" fill="#d93025"/><text x="726" y="188">3</text>
    <circle cx="466" cy="434" r="11" fill="#e37400"/><text x="466" y="438">4</text>
    <circle cx="226" cy="434" r="11" fill="#e37400"/><text x="226" y="438">5</text>
    <circle cx="726" cy="434" r="11" fill="#e37400"/><text x="726" y="438">5</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#3c4043">
    <rect x="780" y="300" width="190" height="150" rx="8" fill="#ffffff" stroke="#dadce0"/>
    <text x="792" y="320" font-weight="bold" fill="#202124">Legend</text>
    <line x1="792" y1="338" x2="822" y2="338" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="830" y="342">connection</text>
    <line x1="792" y1="358" x2="822" y2="358" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-hb)"/>
    <text x="830" y="362">heartbeat (every 1 s)</text>
    <rect x="792" y="372" width="30" height="14" rx="3" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="830" y="383">primary</text>
    <rect x="792" y="394" width="30" height="14" rx="3" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="4 3"/>
    <text x="830" y="405">backup: takes over the</text>
    <text x="830" y="419">primary's ports on failure</text>
    <circle cx="807" cy="436" r="8" fill="#d93025"/>
    <text x="830" y="440">failure step</text>
  </g>

  <!-- Failure scenario timeline -->
  <text x="30" y="525" font-size="13" font-weight="bold" fill="#202124">Failure scenario (steps STEP_WAIT seconds apart, after RUN_WAIT seconds)</text>
  <g font-size="11" fill="#202124">
    <rect x="30" y="540" width="150" height="70" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="42" y="560" font-weight="bold">1 · Kill global</text>
    <text x="42" y="578">primary (SIGKILL);</text>
    <text x="42" y="594">backup takes over</text>

    <rect x="192" y="540" width="150" height="70" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="204" y="560" font-weight="bold">2 · Kill cluster 1</text>
    <text x="204" y="578">primary (SIGKILL);</text>
    <text x="204" y="594">backup takes over</text>

    <rect x="354" y="540" width="150" height="70" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="366" y="560" font-weight="bold">3 · Kill cluster 2</text>
    <text x="366" y="578">primary (SIGKILL);</text>
    <text x="366" y="594">backup takes over</text>

    <rect x="516" y="540" width="150" height="70" rx="8" fill="#fef7e0" stroke="#e37400"/>
    <text x="528" y="560" font-weight="bold">4 · EARLY_JOBS</text>
    <text x="528" y="578">terminate</text>
    <text x="528" y="594">(default: job 2)</text>

    <rect x="678" y="540" width="150" height="70" rx="8" fill="#fef7e0" stroke="#e37400"/>
    <text x="690" y="560" font-weight="bold">5 · Remaining jobs</text>
    <text x="690" y="578">end, one at a time</text>

    <rect x="840" y="540" width="130" height="70" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
    <text x="852" y="560" font-weight="bold">6 · Stop all</text>
    <text x="852" y="578">controllers</text>
  </g>
  <g stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="575" x2="190" y2="575"/>
    <line x1="342" y1="575" x2="352" y2="575"/>
    <line x1="504" y1="575" x2="514" y2="575"/>
    <line x1="666" y1="575" x2="676" y2="575"/>
    <line x1="828" y1="575" x2="838" y2="575"/>
  </g>
</svg>
